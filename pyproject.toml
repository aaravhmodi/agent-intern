[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intern-agent"
version = "0.1.0"
description = "Local job and opportunity discovery with reviewed message drafts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai>=2,<3", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
intern-agent = "opportunity_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_lite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
